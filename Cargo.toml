[workspace]
members = ["lfm2d"]

[package]
name = "lfm2-encoder"
version = "0.0.1"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "LiquidAI LFM2.5 bidirectional encoders (embedding, token/sequence classification, routing) on candle — CPU-first, with ROCm/CUDA/Metal/SYCL features"
keywords = ["lfm2", "candle", "encoder", "embeddings", "classifier"]
categories = ["science"]

[dependencies]
# Published fork includes the ROCm backend exercised on the local AMD GPU.
# Pin both crates to one revision so their Device/Tensor types stay identical.
candle-core = { git = "https://github.com/jgavinray/candle", rev = "8135983bad16655731a0d7ca1a1263a5f335b94a" }
candle-nn = { git = "https://github.com/jgavinray/candle", rev = "8135983bad16655731a0d7ca1a1263a5f335b94a" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
# default features pull onig_sys (C) and esaxx-rs/cpp (C++). esaxx-rs is only
# reachable from the Unigram *trainer* — we never train a vocab — and onig is
# swappable for pure-Rust fancy-regex, which upstream itself uses for wasm.
# Verified byte-identical token IDs across all six LFM2.5 tokenizers on 30
# adversarial cases (2026-08-07). Keeps kaibo's build C++-free and lets the
# crate compile for wasm32-unknown-unknown.
tokenizers = { version = "0.23", default-features = false, features = ["fancy-regex"] }

[features]
default = []
rocm = ["candle-core/rocm", "candle-nn/rocm"]
cuda = ["candle-core/cuda", "candle-nn/cuda"]
metal = ["candle-core/metal", "candle-nn/metal"]
sycl = ["candle-core/sycl", "candle-nn/sycl"]

[dev-dependencies]
# For building a synthetic tokenizer.json in tests/sequence_classification_guards.rs
# (WordLevel's vocab builder wants tokenizers' own hasher). Already in the
# dependency tree transitively via tokenizers itself.
ahash = "0.8"
tempfile = "3"

# Optimize DEPENDENCIES in debug/test builds while our own crate stays
# unoptimized and debuggable. candle does the arithmetic; without this a
# plain `cargo test` runs the model tests at unusable speed and everyone
# learns to type `--release`, which is how a suite quietly stops being run.
[profile.dev.package."*"]
opt-level = 3
