[package]
name = "lfm2d"
version = "0.0.1"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "HTTP sidecar serving LFM2.5 encoder heads (embed/route/spans) and the LFM2.5 opinion engine over a Unix socket and/or TCP — one serial inference worker thread, weight-hashed audit trail"

[features]
default = []
rocm = ["lfm2-encoder/rocm", "candle-transformers/rocm"]
cuda = ["lfm2-encoder/cuda", "candle-transformers/cuda", "dep:candle-kernels"]
metal = ["lfm2-encoder/metal", "candle-transformers/metal"]

[dependencies]
lfm2-encoder = { path = ".." }
candle-transformers = { git = "https://github.com/tobert/candle", rev = "d0735dc91b6e844dd01698fb7935c3171e5bd6bc" }
candle-core = { git = "https://github.com/tobert/candle", rev = "d0735dc91b6e844dd01698fb7935c3171e5bd6bc" }
candle-nn = { git = "https://github.com/tobert/candle", rev = "d0735dc91b6e844dd01698fb7935c3171e5bd6bc" }
# CUDA only: the PTX candle's kernels were built as, whose header names the
# nvcc that built them (the device identity, `device.rs`).
candle-kernels = { git = "https://github.com/tobert/candle", rev = "d0735dc91b6e844dd01698fb7935c3171e5bd6bc", optional = true }
tokenizers = { version = "0.23", default-features = false, features = ["fancy-regex"] }

axum = { version = "0.8", default-features = false, features = ["http1", "json", "tokio", "matched-path"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal", "io-util", "time"] }

serde = { version = "1", features = ["derive"] }
# `float_roundtrip`: a correctly rounded float parse, as Python's is. The
# default parser can land an ulp or two off past 15-16 digits or |e| > 22,
# and `chat` renders tool-call floats back to the model (see
# `chat::check_float`). Crate-wide: every serde_json float parse here.
serde_json = { version = "1", features = ["float_roundtrip"] }

clap = { version = "4", features = ["derive", "env"] }

# Weight-hash audit trail: sha256 over each loaded checkpoint's
# model.safetensors, hex-encoded. No separate `hex` dependency — the
# encoding is four lines (see src/hash.rs).
sha2 = "0.10"

# --threads N calls rayon::ThreadPoolBuilder::build_global() before any
# model load — candle's matmul (the `gemm` crate) already runs on rayon's
# GLOBAL pool transitively, so sizing it here is how this flag actually
# takes effect. Already in the dependency tree via tokenizers/gemm; pinned
# directly since we call its builder API ourselves.
rayon = "1"

# The adjudicator worker's per-priority queues: one bounded channel per
# class, and a `Select` to block on all of them at once, which std's mpsc
# cannot do. Same bounded/try_send/disconnect semantics as the
# `sync_channel` it replaces. Already in the tree's crossbeam family.
crossbeam-channel = "0.5"

# `POST /v1/chat`'s server-sent events: a tokio mpsc receiver as the
# `Stream` axum's `Sse` takes. Already in the tree through tonic.
tokio-stream = "0.1"

# --- tracing + OTLP export (metrics + traces + logs) ---
# Amy's explicit preference over bare Prometheus: one pipe for all three
# signals. rustls everywhere (never openssl); the capture server this was
# verified against only accepts OTLP/gRPC, so `grpc-tonic` is the transport
# (see lfm2d/README.md's telemetry section for the verification notes).
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
tracing-opentelemetry = "0.33"
opentelemetry = "0.32"
opentelemetry_sdk = { version = "0.32", features = ["rt-tokio"] }
opentelemetry-otlp = { version = "0.32", default-features = false, features = [
    "grpc-tonic",
    "tls-webpki-roots",
    "trace",
    "metrics",
    "logs",
] }
opentelemetry-appender-tracing = "0.32"

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
tempfile = "3"
